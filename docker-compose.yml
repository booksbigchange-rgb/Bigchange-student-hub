# Host-local infrastructure only; see DEPLOYMENT.md before deployment.

services:
  mysql:
    image: mysql:8.0
    container_name: mis-mysql
    restart: unless-stopped
    ports:
      - '127.0.0.1:3308:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set a unique database root password}
      MYSQL_USER: ${DB_USER:-mis_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set a unique database password}
      MYSQL_DATABASE: ${DB_NAME:-mis_ilsms}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: mis-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6381:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: mis-minio
    restart: unless-stopped
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?Set a unique MinIO administrator name}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set a unique MinIO administrator password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  redis_data:
  minio_data:
